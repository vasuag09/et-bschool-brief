name: Daily ET B-School Brief

on:
  schedule:
    # 01:30 UTC = 07:00 IST, daily (before class).
    - cron: "30 1 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button for testing

# Least privilege: the job only reads the checkout and reaches external HTTPS.
permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20   # Gemini 3.1 Pro is slower per call than flash
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Send the brief
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_TO: ${{ secrets.BRIEF_TO }}
        run: python -m etbrief.main
