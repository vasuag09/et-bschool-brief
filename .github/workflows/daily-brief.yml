name: Daily ET B-School Brief

on:
  schedule:
    # 01:30 UTC = 07:00 IST, daily (before class).
    - cron: "30 1 * * *"
  workflow_dispatch: {}   # manual "Run workflow" button for testing

# Least privilege: the job only reads the checkout and reaches external HTTPS.
permissions:
  contents: read

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 10   # Claude Haiku 4.5 is fast per call
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - run: pip install -r requirements.txt

      - name: Send the brief
        env:
          AWS_BEARER_TOKEN_BEDROCK: ${{ secrets.AWS_BEARER_TOKEN_BEDROCK }}
          BEDROCK_REGION: ap-south-1
          BEDROCK_MODEL_ID: global.anthropic.claude-haiku-4-5-20251001-v1:0
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          BRIEF_TO: ${{ secrets.BRIEF_TO }}
        run: python -m etbrief.main
